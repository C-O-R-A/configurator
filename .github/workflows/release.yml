name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_script: dist:linux
            artifact_glob: dist/*.AppImage
          - os: windows-latest
            dist_script: dist:win
            artifact_glob: dist/*.exe
          - os: macos-latest
            dist_script: dist:mac
            artifact_glob: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root + workspace deps
        run: npm install

      - name: Build backend with PyInstaller
        working-directory: apps/backend
        run: |
          pip install -r requirements.txt --break-system-packages
          pip install pyinstaller --break-system-packages
          pyinstaller --onefile --name cora-backend main.py

      - name: Build Electron app (${{ matrix.dist_script }})
        run: npm run ${{ matrix.dist_script }}

      - name: Upload artifact to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.artifact_glob }} --clobber
